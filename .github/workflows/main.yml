name: Update-Dates

on:
  schedule:
  - cron: '01 0 1 * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Update dates
        shell: pwsh
        run: ./cv/UpdateDates.ps1

      # Commit only when the text changed, so a no-op run doesn't fail
      - name: Commit and push
        run: |
          git config user.name 'Luvai Hassanali'
          git config user.email 'luvaihassanali@gmail.com'
          git add cv/cv.html
          if git diff --cached --quiet; then
            echo "No change to commit"
            exit 0
          fi
          git commit -m "Update month $(date -u '+%Y-%m-%d %H:%M:%SZ')"
          git push
